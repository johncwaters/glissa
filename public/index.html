<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Glissa</title>
  <style>
    /* Inline critical styles render before JS modules load. Colors here are the Phyrexian
       (default theme) values; theme.js repaints to the saved theme on connect. A brief flash
       for users on a non-default theme is an accepted fast-first-paint tradeoff. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0810;
      color: #c8c0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Hide app shell until ready; phone excluded since style.css's @layer components rule can't outrank this inline one. */
    .app-shell { display: none; }
    html:not([data-layout="phone"]) .app-ready .app-shell { display: contents; }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0810;
      transition: opacity 300ms ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #e8e0ff;
      text-transform: uppercase;
    }

    .loading-title::before {
      content: '\25b8 ';
      color: #c084fc;
    }

    .loading-status {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      /* [P3] Lifted from #6a5e90 (~4.1:1) to #8276b0 (≥4.5:1) for pre-theme paint */
      color: #8276b0;
      letter-spacing: 0.04em;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #2a2440;
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Shutdown overlay - hidden until triggered */
    .shutdown-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 8, 16, 0);
      backdrop-filter: blur(0px);
      pointer-events: none;
      opacity: 0;
      transition: background 400ms ease, backdrop-filter 400ms ease, opacity 300ms ease;
    }

    .shutdown-screen.active {
      background: rgba(10, 8, 16, 0.92);
      backdrop-filter: blur(8px);
      pointer-events: auto;
      opacity: 1;
    }

    .shutdown-status {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      /* [P3] Lifted to ≥4.5:1 on pre-theme bg */
      color: #8276b0;
      letter-spacing: 0.04em;
      transition: color 300ms ease;
    }

    .shutdown-screen.done .loading-spinner {
      animation: none;
      border-color: #2a2440;
      border-top-color: #2a2440;
      opacity: 0.3;
    }

    .shutdown-screen.done .shutdown-status {
      color: #4a4268;
    }
  </style>
</head>
<body>
  <!-- Loading screen - visible immediately, removed on WS connect -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-title">Glissa</div>
    <div class="loading-spinner"></div>
    <div class="loading-status" id="loading-status">Connecting to server...</div>
  </div>

  <!-- Shutdown overlay - hidden until triggered -->
  <div class="shutdown-screen" id="shutdown-screen">
    <div class="loading-title">Glissa</div>
    <div class="loading-spinner"></div>
    <div class="shutdown-status" id="shutdown-status">Shutting down sessions...</div>
  </div>

  <!-- App shell - hidden until CSS loads and WS connects -->
  <!-- [P3] Tailwind utility duplicates stripped - semantic classes in style.css are authoritative -->
  <!-- This is the DESKTOP layout. Under [data-layout="phone"] the whole shell is display:none and the
       phone shell (public/phone/phone-shell.js) renders instead, borrowing the header controls, the
       review sidebar, the Radar and PRs panels and the focused session's card out of here. Sessions cards stay
       parented in #sessions-container either way: it is their one canonical home. -->
  <div class="app-shell">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <h1 class="header-title">Glissa</h1>
          <nav class="header-tabs" id="header-tabs" role="tablist" aria-label="Primary views">
            <button class="header-tab" id="tab-focus" role="tab" aria-selected="true" aria-controls="view-focus" tabindex="0">Focus</button>
            <button class="header-tab" id="tab-radar" role="tab" aria-selected="false" aria-controls="view-radar" tabindex="-1">Radar<span class="tab-activity" id="tab-radar-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-prs" role="tab" aria-selected="false" aria-controls="view-prs" tabindex="-1">PRs<span class="tab-activity" id="tab-prs-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-usage" role="tab" aria-selected="false" aria-controls="view-usage" tabindex="-1">Usage<span class="tab-activity" id="tab-usage-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-navigator" role="tab" aria-selected="false" aria-controls="view-navigator" tabindex="-1">Navigator<span class="tab-activity" id="tab-navigator-activity" aria-hidden="true"></span></button>
          </nav>
        </div>
        <div class="header-right">
          <div class="status-indicator" id="status-indicator">
            <span class="header-connection" id="connection-status" role="status" aria-label="Server connection">
              <span class="connection-dot"></span>
              <span class="connection-label">Connecting</span>
            </span>
          </div>
          <span class="header-aggregate" id="aggregate-status" role="status" aria-live="polite"></span>
          <button class="btn-add-header" id="btn-add-session-header" type="button" title="Add a new session">+ Session</button>
          <button class="btn-help" id="btn-help" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts and version">?</button>
          <div class="header-menu" id="header-menu">
            <button class="btn-menu" id="btn-menu" title="Menu" aria-label="Open menu" aria-haspopup="menu" aria-expanded="false" aria-controls="header-menu-dropdown">&#9776;</button>
            <div class="header-menu-dropdown" id="header-menu-dropdown" role="menu">
              <button class="menu-item" id="btn-mute" role="menuitem"><span class="menu-item-glyph">&#9834;</span>Mute Alerts</button>
              <button class="menu-item" id="btn-settings" role="menuitem"><span class="menu-item-glyph">&#9881;</span>Settings</button>
              <button class="menu-item menu-item-warning" id="btn-restart" role="menuitem"><span class="menu-item-glyph">&#8634;</span>Restart Server</button>
              <div class="menu-divider" id="menu-divider-shutdown"></div>
              <button class="menu-item menu-item-danger" id="btn-shutdown" role="menuitem"><span class="menu-item-glyph">&#9632;</span>Shut Down</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- Startup update notice: populated by app.js on an `update-available` control message. -->
    <div class="update-banner" id="update-banner" role="status" hidden>
      <span class="update-banner-text" id="update-banner-text"></span>
      <a class="update-banner-link" id="update-banner-link" target="_blank" rel="noopener noreferrer" hidden>View changes</a>
      <code class="update-banner-cmd" id="update-banner-cmd"></code>
      <button class="update-banner-copy" id="update-banner-copy" type="button">Copy</button>
      <button class="update-banner-dismiss" id="update-banner-dismiss" type="button" aria-label="Dismiss update notice">&times;</button>
    </div>
    <!-- Body row: main views on the left, the review sidebar docked right. Always docked here; on the
         phone layout the same element is re-parented into the Review screen. -->
    <div class="app-body" id="app-body">
      <main class="app-main" id="app-main">
        <!-- Off-screen card home: every session card lives here; Focus borrows cards from it into the
             center. No longer a navigable view (the Sessions tab was removed); always hidden via CSS. -->
        <section class="sessions" id="sessions-container">
          <!-- Session cards injected here by app.js -->
        </section>
        <!-- Radar view: PostHog issue status, mounted by radar-panel.js -->
        <section class="radar-view" id="view-radar" role="tabpanel" aria-labelledby="tab-radar" hidden></section>
        <!-- PRs view: GitHub PR auto-review status, mounted by pr-panel.js -->
        <section class="pr-view" id="view-prs" role="tabpanel" aria-labelledby="tab-prs" hidden></section>
        <!-- Usage view: token and estimated-cost roll-up, mounted by usage-panel.js -->
        <section class="usage-view" id="view-usage" role="tabpanel" aria-labelledby="tab-usage" hidden></section>
        <!-- Navigator view: live findings from the editor buffers the navigator lane mirrors, mounted by navigator-panel.js -->
        <section class="navigator-view" id="view-navigator" role="tabpanel" aria-labelledby="tab-navigator" hidden></section>
        <!-- Focus view (default): roster rail + single-focus center, mounted by focus-view.js -->
        <section class="focus-view" id="view-focus" role="tabpanel" aria-labelledby="tab-focus" hidden>
          <nav class="focus-rail" id="focus-rail" role="listbox" aria-label="Session roster" aria-keyshortcuts="ArrowUp ArrowDown Alt+ArrowUp Alt+ArrowDown"></nav>
          <!-- Drag handle: resizes the rail (pointer drag, Arrow keys when focused, double-click resets). -->
          <div class="focus-rail-resizer" id="focus-rail-resizer" role="separator" aria-orientation="vertical" aria-label="Resize session rail" tabindex="0"></div>
          <div class="focus-center" id="focus-center"></div>
        </section>
      </main>
      <!-- Right review sidebar: the single home for the worktree review gate; built by review-sidebar.js.
           The phone Review screen re-parents this exact element rather than building a second one. -->
      <aside class="app-sidebar" id="review-sidebar" aria-label="Session review"></aside>
    </div>
    <!-- Health monitor footer injected by health-monitor.js -->
    <div id="health-footer-mount"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
