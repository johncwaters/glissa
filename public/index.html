<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Glissa</title>
  <style>
    /* Inline critical styles render before JS modules load. Colors here are the Phyrexian
       (default theme) values; theme.js repaints to the saved theme on connect. A brief flash
       for users on a non-default theme is an accepted fast-first-paint tradeoff. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0810;
      color: #c8c0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Hide app shell until styles are ready */
    .app-shell { display: none; }
    .app-ready .app-shell { display: contents; }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0810;
      transition: opacity 300ms ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #e8e0ff;
      text-transform: uppercase;
    }

    .loading-title::before {
      content: '\25b8 ';
      color: #c084fc;
    }

    .loading-status {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      /* [P3] Lifted from #6a5e90 (~4.1:1) to #8276b0 (≥4.5:1) for pre-theme paint */
      color: #8276b0;
      letter-spacing: 0.04em;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #2a2440;
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Shutdown overlay — hidden until triggered */
    .shutdown-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 8, 16, 0);
      backdrop-filter: blur(0px);
      pointer-events: none;
      opacity: 0;
      transition: background 400ms ease, backdrop-filter 400ms ease, opacity 300ms ease;
    }

    .shutdown-screen.active {
      background: rgba(10, 8, 16, 0.92);
      backdrop-filter: blur(8px);
      pointer-events: auto;
      opacity: 1;
    }

    .shutdown-status {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      /* [P3] Lifted to ≥4.5:1 on pre-theme bg */
      color: #8276b0;
      letter-spacing: 0.04em;
      transition: color 300ms ease;
    }

    .shutdown-screen.done .loading-spinner {
      animation: none;
      border-color: #2a2440;
      border-top-color: #2a2440;
      opacity: 0.3;
    }

    .shutdown-screen.done .shutdown-status {
      color: #4a4268;
    }
  </style>
</head>
<body>
  <!-- Loading screen — visible immediately, removed on WS connect -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-title">Glissa</div>
    <div class="loading-spinner"></div>
    <div class="loading-status" id="loading-status">Connecting to server...</div>
  </div>

  <!-- Shutdown overlay — hidden until triggered -->
  <div class="shutdown-screen" id="shutdown-screen">
    <div class="loading-title">Glissa</div>
    <div class="loading-spinner"></div>
    <div class="shutdown-status" id="shutdown-status">Shutting down sessions...</div>
  </div>

  <!-- App shell — hidden until CSS loads and WS connects -->
  <!-- [P3] Tailwind utility duplicates stripped — semantic classes in style.css are authoritative -->
  <div class="app-shell">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <h1 class="header-title">Glissa</h1>
          <nav class="header-tabs" id="header-tabs" role="tablist" aria-label="Primary views">
            <button class="header-tab" id="tab-sessions" role="tab" aria-selected="true" aria-controls="sessions-container" tabindex="0">Sessions</button>
            <button class="header-tab" id="tab-teams" role="tab" aria-selected="false" aria-controls="view-teams" tabindex="-1">Teams<span class="tab-activity" id="tab-teams-activity" aria-hidden="true"></span></button>
          </nav>
        </div>
        <div class="header-right">
          <div class="status-indicator" id="status-indicator">
            <span class="header-connection" id="connection-status">
              <span class="connection-dot"></span>
              <span class="connection-label">Connecting</span>
            </span>
          </div>
          <span class="header-aggregate" id="aggregate-status" role="status" aria-live="polite"></span>
          <button class="btn-add-header" id="btn-add-session-header" type="button" title="Add a new session">+ Session</button>
          <div class="header-menu" id="header-menu">
            <button class="btn-menu" id="btn-menu" title="Menu" aria-label="Open menu" aria-haspopup="menu" aria-expanded="false" aria-controls="header-menu-dropdown">&#9776;</button>
            <div class="header-menu-dropdown" id="header-menu-dropdown" role="menu">
              <button class="menu-item" id="btn-mute" role="menuitem"><span class="menu-item-glyph">&#9834;</span>Mute Alerts</button>
              <button class="menu-item" id="btn-settings" role="menuitem"><span class="menu-item-glyph">&#9881;</span>Settings</button>
              <button class="menu-item menu-item-warning" id="btn-restart" role="menuitem"><span class="menu-item-glyph">&#8634;</span>Restart Server</button>
              <div class="menu-divider"></div>
              <button class="menu-item menu-item-danger" id="btn-shutdown" role="menuitem"><span class="menu-item-glyph">&#9632;</span>Shut Down</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="app-main" id="app-main">
      <section class="sessions" id="sessions-container" role="tabpanel" aria-labelledby="tab-sessions">
        <!-- Session cards injected here by app.js -->
      </section>
      <!-- Minimized session cards injected here by app.js; bar hides via :empty when none are minimized -->
      <div class="minimized-bar" id="minimized-bar" role="toolbar" aria-label="Minimized sessions" aria-keyshortcuts="Alt+W"></div>
      <!-- Teams view: dedicated tab space, mounted by teams-panel.js -->
      <section class="teams-view" id="view-teams" role="tabpanel" aria-labelledby="tab-teams" hidden></section>
    </main>
    <!-- Health monitor footer injected by health-monitor.js -->
    <div id="health-footer-mount"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
