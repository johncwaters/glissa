<h2 class="dialog-title" id="add-session-title">Add Session</h2>
<label class="dialog-label">
  Pick a project:
  <select class="dialog-input project-picker" id="add-session-picker">
    <option value="" disabled selected>Scanning...</option>
  </select>
</label>
<button type="button" class="dialog-advanced-toggle" id="add-session-advanced-toggle">Advanced options</button>
<div class="dialog-advanced-panel" id="add-session-advanced" hidden>
  <label class="dialog-label">
    Name
    <input type="text" class="dialog-input" id="add-session-name" placeholder="my-project" autocomplete="off" spellcheck="false">
  </label>
  <label class="dialog-label">
    Path
    <input type="text" class="dialog-input" id="add-session-path" placeholder="C:\Users\...\my-project" autocomplete="off" spellcheck="false">
  </label>
</div>
<label class="dialog-checkbox-label dialog-danger-checkbox" id="add-session-skip-perms-label">
  <input type="checkbox" id="add-session-skip-perms">
  <span class="dialog-danger-icon" aria-hidden="true">&#9888;</span>
  <span class="dialog-danger-label">Skip permission prompts</span>
  <span class="dialog-danger-hint">Grants unrestricted filesystem access via <code>--dangerously-skip-permissions</code>. Use only in trusted projects.</span>
</label>
<div class="dialog-error" id="add-session-error"></div>
<div class="dialog-actions">
  <button class="btn-dialog btn-dialog-cancel" id="add-session-cancel">Cancel</button>
  <button class="btn-dialog btn-dialog-confirm" id="add-session-confirm">Add</button>
</div>
