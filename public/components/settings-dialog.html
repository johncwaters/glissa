<h2 class="dialog-title" id="settings-title">Settings</h2>
<div class="settings-tabs" role="tablist" aria-label="Settings sections">
  <button type="button" class="settings-tab" role="tab" id="settings-tab-general" aria-controls="settings-panel-general" aria-selected="true" data-tab="general">General</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-terminal" aria-controls="settings-panel-terminal" aria-selected="false" data-tab="terminal" tabindex="-1">Terminal</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-repos" aria-controls="settings-panel-repos" aria-selected="false" data-tab="repos" tabindex="-1">Repos</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-advanced" aria-controls="settings-panel-advanced" aria-selected="false" data-tab="advanced" tabindex="-1">Advanced</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-shortcuts" aria-controls="settings-panel-shortcuts" aria-selected="false" data-tab="shortcuts" tabindex="-1">Shortcuts</button>
</div>

<div class="settings-panel" id="settings-panel-general" role="tabpanel" aria-labelledby="settings-tab-general" data-panel="general">
  <label class="dialog-label">
    Theme
    <select class="dialog-input" id="settings-theme"></select>
    <span class="dialog-hint">Color scheme for the dashboard</span>
    <span class="dialog-hint dialog-hint-warning" id="settings-theme-warning"></span>
  </label>
  <label class="dialog-label">
    Alert Sound
    <select class="dialog-input" id="settings-sound"></select>
    <span class="dialog-hint">Sound played when a session needs attention</span>
  </label>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-notifications">
    Desktop Notifications
    <span class="dialog-hint" id="settings-notifications-hint">Native browser notification when a session needs attention while the dashboard is in the background</span>
  </label>
  <label class="dialog-label">
    Editor command
    <input type="text" class="dialog-input" id="settings-editor-command" placeholder="code -g {file}" autocomplete="off" spellcheck="false">
    <span class="dialog-hint">Opens team run artifacts. Use {file} for the path (appended if omitted). Blank uses the OS default app.</span>
  </label>
</div>

<div class="settings-panel" id="settings-panel-terminal" role="tabpanel" aria-labelledby="settings-tab-terminal" data-panel="terminal" hidden>
  <div class="settings-timeout-grid">
    <label class="dialog-label">
      Replay Buffer (KB)
      <input type="number" class="dialog-input" id="settings-replay-buffer" min="64" max="16384" step="64" autocomplete="off">
      <span class="dialog-hint">PTY output kept for late-joining clients</span>
    </label>
  </div>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-cursor-blink">
    Cursor Blink
    <span class="dialog-hint">Blinking cursor in terminal</span>
  </label>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-check-updates">
    Check for Updates on Startup
    <span class="dialog-hint">Check the npm registry at launch and show the update command when a newer glissa is available</span>
  </label>
</div>

<div class="settings-panel" id="settings-panel-repos" role="tabpanel" aria-labelledby="settings-tab-repos" data-panel="repos" hidden>
  <div class="settings-section">
    <div class="settings-section-title">Repository Roots</div>
    <span class="dialog-hint">Directories scanned for projects when adding sessions</span>
    <div class="settings-root-list" id="settings-root-list"></div>
    <div class="settings-add-row">
      <input type="text" class="dialog-input settings-root-input" id="settings-root-input" placeholder="C:\Users\...\repos" autocomplete="off" spellcheck="false">
      <button class="btn-dialog btn-dialog-confirm btn-settings-add" id="settings-root-add">Add</button>
    </div>
    <div class="dialog-field-error" id="settings-root-error"></div>
  </div>
</div>

<div class="settings-panel" id="settings-panel-advanced" role="tabpanel" aria-labelledby="settings-tab-advanced" data-panel="advanced" hidden>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-debug-mode">
    Debug Mode
    <span class="dialog-hint">Show a debug button on session cards to inspect state, transitions, and detection signals.</span>
  </label>
</div>

<div class="settings-panel settings-shortcuts" id="settings-panel-shortcuts" role="tabpanel" aria-labelledby="settings-tab-shortcuts" data-panel="shortcuts" hidden>
  <div class="shortcut-groups" id="settings-shortcut-groups"></div>
  <div class="settings-about">
    <span class="settings-about-version">GLISSA <span class="settings-about-v" id="settings-version"></span></span>
    <span class="settings-about-links">
      <a class="settings-about-link" id="settings-link-repo" href="https://github.com/johncwaters/glissa" target="_blank" rel="noopener">GitHub</a>
      <a class="settings-about-link" id="settings-link-changelog" href="https://github.com/johncwaters/glissa/blob/main/CHANGELOG.md" target="_blank" rel="noopener">Changelog</a>
    </span>
  </div>
</div>

<div class="dialog-error" id="settings-error"></div>
<div class="dialog-actions settings-actions">
  <button class="btn-dialog btn-dialog-cancel" id="settings-cancel">Cancel</button>
  <button class="btn-dialog btn-dialog-confirm" id="settings-save">Save</button>
</div>
