<h2 class="dialog-title" id="settings-title">Settings</h2>
<div class="settings-tabs" role="tablist" aria-label="Settings sections">
  <button type="button" class="settings-tab" role="tab" id="settings-tab-general" aria-controls="settings-panel-general" aria-selected="true" data-tab="general">General</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-terminal" aria-controls="settings-panel-terminal" aria-selected="false" data-tab="terminal" tabindex="-1">Terminal</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-repos" aria-controls="settings-panel-repos" aria-selected="false" data-tab="repos" tabindex="-1">Repos</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-advanced" aria-controls="settings-panel-advanced" aria-selected="false" data-tab="advanced" tabindex="-1">Advanced</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-telegram" aria-controls="settings-panel-telegram" aria-selected="false" data-tab="telegram" tabindex="-1">Telegram</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-pr-review" aria-controls="settings-panel-pr-review" aria-selected="false" data-tab="pr-review" tabindex="-1">PR Review</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-posthog" aria-controls="settings-panel-posthog" aria-selected="false" data-tab="posthog" tabindex="-1">PostHog</button>
  <button type="button" class="settings-tab" role="tab" id="settings-tab-shortcuts" aria-controls="settings-panel-shortcuts" aria-selected="false" data-tab="shortcuts" tabindex="-1">Shortcuts</button>
</div>

<div class="settings-panel" id="settings-panel-general" role="tabpanel" aria-labelledby="settings-tab-general" data-panel="general">
  <label class="dialog-label">
    Theme
    <select class="dialog-input" id="settings-theme"></select>
    <span class="dialog-hint">Color scheme for the dashboard</span>
    <span class="dialog-hint dialog-hint-warning" id="settings-theme-warning"></span>
  </label>
  <label class="dialog-label">
    Alert Sound
    <select class="dialog-input" id="settings-sound"></select>
    <span class="dialog-hint">Sound played when a session needs attention</span>
  </label>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-notifications">
    Desktop Notifications
    <span class="dialog-hint" id="settings-notifications-hint">Native browser notification when a session needs attention while the dashboard is in the background</span>
  </label>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-auto-resume">
    Auto-resume sessions on startup
    <span class="dialog-hint">Sessions that were running when Glissa last shut down or crashed auto-spawn with their conversation resumed</span>
  </label>
</div>

<div class="settings-panel" id="settings-panel-terminal" role="tabpanel" aria-labelledby="settings-tab-terminal" data-panel="terminal" hidden>
  <div class="settings-timeout-grid">
    <label class="dialog-label">
      Replay Buffer (KB)
      <input type="number" class="dialog-input" id="settings-replay-buffer" min="64" max="16384" step="64" autocomplete="off">
      <span class="dialog-hint">PTY output kept for late-joining clients</span>
    </label>
  </div>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-cursor-blink">
    Cursor Blink
    <span class="dialog-hint">Blinking cursor in terminal</span>
  </label>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-check-updates">
    Check for Updates on Startup
    <span class="dialog-hint">Check GitHub at launch and show the update command when a newer glissa is available</span>
  </label>
</div>

<div class="settings-panel" id="settings-panel-repos" role="tabpanel" aria-labelledby="settings-tab-repos" data-panel="repos" hidden>
  <div class="settings-section">
    <div class="settings-section-title">Repository Roots</div>
    <span class="dialog-hint">Directories scanned for projects when adding sessions</span>
    <div class="settings-root-list" id="settings-root-list"></div>
    <div class="settings-add-row">
      <input type="text" class="dialog-input settings-root-input" id="settings-root-input" placeholder="C:\Users\...\repos" autocomplete="off" spellcheck="false">
      <button class="btn-dialog btn-dialog-confirm btn-settings-add" id="settings-root-add">Add</button>
    </div>
    <div class="dialog-field-error" id="settings-root-error"></div>
  </div>
</div>

<div class="settings-panel" id="settings-panel-advanced" role="tabpanel" aria-labelledby="settings-tab-advanced" data-panel="advanced" hidden>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-debug-mode">
    Debug Mode
    <span class="dialog-hint">Show a debug button on session cards to inspect state, transitions, and detection signals.</span>
  </label>
</div>

<div class="settings-panel" id="settings-panel-telegram" role="tabpanel" aria-labelledby="settings-tab-telegram" data-panel="telegram" hidden>
  <label class="dialog-label">
    Bot token
    <input type="password" class="dialog-input" id="settings-telegram-bot-token" autocomplete="off" spellcheck="false">
  </label>
  <label class="dialog-label">
    Chat id
    <input type="text" class="dialog-input" id="settings-telegram-chat-id" autocomplete="off" spellcheck="false">
    <span class="dialog-hint">One bot, shared by session notifications, PR review pings and PostHog monitoring pings. Each lane is switched on separately; both fields are required before any of them can send.</span>
  </label>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-telegram-notifications">
    Send session notifications to Telegram
    <span class="dialog-hint">Pings when a session completes, needs input, or fails AND no dashboard tab is open anywhere, so the browser notification would reach nobody.</span>
  </label>
</div>

<div class="settings-panel" id="settings-panel-pr-review" role="tabpanel" aria-labelledby="settings-tab-pr-review" data-panel="pr-review" hidden>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-pr-enabled">
    Enable PR auto-review
    <span class="dialog-hint">Reviews your own open pull requests and merges the clean ones on green checks. Needs gh authenticated on this machine, and the bot credentials on the Telegram tab. Pings fire on actionable events only (changes requested, conflicts resolved, merged, error). Takes effect immediately, no restart required.</span>
  </label>
  <div class="settings-section">
    <div class="settings-section-title">Projects to watch</div>
    <div class="settings-root-list" id="settings-pr-projects"></div>
  </div>
  <div class="settings-timeout-grid">
    <label class="dialog-label">
      Poll interval (minutes)
      <input type="number" class="dialog-input" id="settings-pr-interval" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Max concurrent reviews
      <input type="number" class="dialog-input" id="settings-pr-max-reviews" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Review timeout (seconds)
      <input type="number" class="dialog-input" id="settings-pr-timeout" min="1" step="1" autocomplete="off">
    </label>
  </div>
  <label class="dialog-label">
    Merge method
    <select class="dialog-input" id="settings-pr-merge-method">
      <option value="rebase">Rebase</option>
      <option value="squash">Squash</option>
      <option value="merge">Merge</option>
    </select>
  </label>
</div>

<div class="settings-panel" id="settings-panel-posthog" role="tabpanel" aria-labelledby="settings-tab-posthog" data-panel="posthog" hidden>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-posthog-enabled">
    Enable PostHog monitoring
    <span class="dialog-hint">Polls PostHog error tracking and investigates the issues that move. Needs a personal API key with read access.</span>
  </label>
  <label class="dialog-label">
    Host
    <input type="text" class="dialog-input" id="settings-posthog-host" placeholder="https://us.posthog.com" autocomplete="off" spellcheck="false">
    <span class="dialog-hint">Use https://eu.posthog.com for EU cloud, or your self-hosted URL.</span>
  </label>
  <label class="dialog-label">
    Personal API key
    <input type="password" class="dialog-input" id="settings-posthog-api-key" autocomplete="off" spellcheck="false">
  </label>
  <label class="dialog-label">
    Projects
    <input type="text" class="dialog-input" id="settings-posthog-projects" placeholder="all" autocomplete="off" spellcheck="false">
    <span class="dialog-hint">Either all, or a comma-separated list of numeric PostHog project ids.</span>
  </label>
  <div class="settings-timeout-grid">
    <label class="dialog-label">
      Poll interval (minutes)
      <input type="number" class="dialog-input" id="settings-posthog-interval" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Max concurrent investigations
      <input type="number" class="dialog-input" id="settings-posthog-max-investigations" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Investigation timeout (seconds)
      <input type="number" class="dialog-input" id="settings-posthog-timeout" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Min users to investigate
      <input type="number" class="dialog-input" id="settings-posthog-min-users" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Escalation threshold (users)
      <input type="number" class="dialog-input" id="settings-posthog-escalation" min="1" step="1" autocomplete="off">
    </label>
  </div>
  <label class="dialog-label dialog-checkbox-label">
    <input type="checkbox" class="dialog-checkbox" id="settings-posthog-traffic-enabled">
    Traffic spike alerts
    <span class="dialog-hint">Pings when a project's unique users in the last hour run far above its own hourly baseline.</span>
  </label>
  <div class="settings-timeout-grid">
    <label class="dialog-label">
      Spike multiplier
      <input type="number" class="dialog-input" id="settings-posthog-traffic-multiplier" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Min users to alert
      <input type="number" class="dialog-input" id="settings-posthog-traffic-min-users" min="1" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Spike cooldown (minutes)
      <input type="number" class="dialog-input" id="settings-posthog-traffic-cooldown" min="0" step="1" autocomplete="off">
    </label>
    <label class="dialog-label">
      Baseline window (days)
      <input type="number" class="dialog-input" id="settings-posthog-traffic-baseline" min="1" max="30" step="1" autocomplete="off">
    </label>
  </div>
</div>

<div class="settings-panel settings-shortcuts" id="settings-panel-shortcuts" role="tabpanel" aria-labelledby="settings-tab-shortcuts" data-panel="shortcuts" hidden>
  <div class="shortcut-groups" id="settings-shortcut-groups"></div>
  <div class="settings-about">
    <span class="settings-about-version">GLISSA <span class="settings-about-v" id="settings-version"></span></span>
    <span class="settings-about-links">
      <a class="settings-about-link" id="settings-link-repo" href="https://github.com/johncwaters/glissa" target="_blank" rel="noopener">GitHub</a>
      <a class="settings-about-link" id="settings-link-changelog" href="https://github.com/johncwaters/glissa/blob/main/CHANGELOG.md" target="_blank" rel="noopener">Changelog</a>
    </span>
  </div>
</div>

<div class="dialog-error" id="settings-error"></div>
<div class="dialog-actions settings-actions">
  <button class="btn-dialog btn-dialog-cancel" id="settings-cancel">Cancel</button>
  <button class="btn-dialog btn-dialog-confirm" id="settings-save">Save</button>
</div>
