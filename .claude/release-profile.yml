# Release profile for the /release skill. Derived 2026-07-23 from repo survey; rewritten 2026-08-09 when
# distribution moved off the npm registry to the claude-setup repo (see docs/distribution.md).
type: other
versioning:
  scheme: semver
  version_file: package.json        # hand-edited; lockfile synced in same commit
  tag_format: vX.Y.Z                # created by scripts/release.js (historical anomaly: first tag was 0.1.0 unprefixed; v0.11.0 gap exists)
changelog:
  path: CHANGELOG.md
  format: keep_a_changelog          # [Unreleased] on top; scripts/release.js extracts the version section for GitHub release notes
git:
  release_from: main                # trunk-based since 2026-08-30 (docs/plan-base-branch.md); no integration branch
  release_commit_pattern: "chore(release): X.Y.Z"
  require: [clean_tree]
gates:
  pre_tag:
    - node scripts/check-package-files.js          # verifies package.json files whitelist (bounds the GitHub-spec install tarball)
    - npm run build                                # Vite frontend; dist/index.html must exist
  post_release:
    - git ls-remote --tags origin vX.Y.Z           # GitHub has the tag
    - gh release view vX.Y.Z
    - git ls-remote --tags origin vX.Y.Z^{}        # the startup update check can see the peeled release tag
  evidence: [git_tag, github_release_url, remote_release_tag]
publish:
  trigger: local_script
  detail:
    command: npm run release                       # scripts/release.js
    script_does: dirty-tree check, tag-exists check, files check, build, git push, annotated tag + push tag, gh release create from changelog section
    no_registry: package is private; nothing is published to npm. Distribution is the GitHub repo plus claude-setup provisioning (docs/distribution.md)
    partial_failure_note: script is not atomic; on mid-flight failure check what landed (pushed commits vs tag vs release) before any rerun
  auth: gh_cli_local                               # gh for the release; git push for commits and the tag
rollback:
  steps:
    - "git push origin :refs/tags/vX.Y.Z && git tag -d vX.Y.Z"
    - "gh release delete vX.Y.Z"
    - "Revert the release commit on main, or forward-fix with a new patch version"
  never: [reuse_version, force_push_main]
approval:
  human_before: [npm_run_release]
