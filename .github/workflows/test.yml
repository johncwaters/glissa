name: test

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  test:
    # Windows is the development host; the ubuntu leg is what keeps the POSIX-gated paths (symlinked
    # worktree shares, file modes) from rotting, since they skip on every Windows run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
