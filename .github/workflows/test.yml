name: test

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  test:
    # Windows is the development host; the ubuntu leg is what keeps the POSIX-gated paths (symlinked
    # worktree shares, file modes) from rotting, since they skip on every Windows run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # npm ci blocks node-pty's install scripts (npm 11.17+ default), so only this leg tests the documented global install where they run and the native module compiles.
      - name: packaged global install
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          TARBALL=$(npm pack | tail -1)
          npx --yes npm@12 install -g "./$TARBALL" --dangerously-allow-all-scripts
          glissa doctor > doctor.log
          cat doctor.log
          # doctor reports a broken native module and still exits 0, so this line is the real gate.
          grep -q "loads OK" doctor.log
